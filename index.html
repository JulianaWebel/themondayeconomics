<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Monday ECO-nomics &middot; Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unna:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f5f0e8;
      --bg-elev: #ebe4d6;
      --ink: #1a1a18;
      --ink-dim: #333330;
      --muted: #666660;
      --muted-strong: #444440;
      --accent: #6ba85e;
      --accent-strong: #4d8842;
      --border: rgba(26,26,24,0.14);
      --border-strong: rgba(26,26,24,0.32);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    header {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border-strong);
      padding: 2.5rem 0 0;
    }

    .masthead-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4rem;
      margin-bottom: 1.2rem;
    }

    .masthead-meta {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .masthead-rule { height: 1px; background: var(--border-strong); margin: 0 4rem; }

    .masthead-title {
      text-align: center;
      padding: 1.8rem 4rem 1.5rem;
    }

    .masthead-title h1 {
      font-family: 'Unna', 'Times New Roman', serif;
      font-size: clamp(2.8rem, 6.5vw, 5.5rem);
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1;
      color: var(--ink);
    }

    .masthead-tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.9rem;
    }

    .masthead-rule-bottom {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-strong) 20%, var(--accent-strong) 80%, transparent);
      margin: 0;
      opacity: 0.5;
    }

    .archive-label {
      position: relative;
      z-index: 1;
      padding: 2.5rem 4rem 0;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .archive-label span {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .archive-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    main {
      position: relative;
      z-index: 1;
      padding: 2rem 4rem 5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--border-strong);
      margin-bottom: 3.5rem;
      background: #fbf7ef;
      box-shadow: 4px 4px 0 rgba(26,26,24,0.08);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards;
      animation-delay: 0.1s;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-thumbnail {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #ffffff;
      border: 1px solid rgba(26,26,24,0.16);
      box-shadow: 0 4px 12px rgba(26,26,24,0.10), 0 1px 3px rgba(26,26,24,0.06);
      z-index: 2;
    }

    .hero-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform 0.5s ease;
    }

    .hero:hover .hero-thumbnail img { transform: scale(1.02); }

    .hero-thumbnail .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: repeating-linear-gradient(45deg, rgba(26,26,24,0.04) 0, rgba(26,26,24,0.04) 1px, transparent 1px, transparent 12px);
    }

    .hero-info {
      padding: 3rem 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid var(--border-strong);
    }

    .latest-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-strong);
      margin-bottom: 1.5rem;
    }

    .latest-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent-strong);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.8); }
    }

    .hero-issue-number {
      font-family: 'Unna', serif;
      font-size: clamp(3.5rem, 6vw, 6rem);
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 0.3rem;
    }

    .hero-issue-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .hero-pub-name {
      font-family: 'Unna', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--ink-dim);
      margin-bottom: 0.4rem;
    }

    .hero-date {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .hero-divider {
      width: 3rem;
      height: 1px;
      background: var(--accent-strong);
      opacity: 0.7;
      margin: 1.5rem 0;
    }

    .hero-read-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--border-strong);
      padding: 0.8rem 1.4rem;
      transition: all 0.25s ease;
      align-self: flex-start;
      margin-top: auto;
      background: var(--bg);
    }

    .hero-read-link:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
      color: var(--bg);
      gap: 1rem;
    }

    .hero-read-link .arrow { transition: transform 0.25s ease; }
    .hero-read-link:hover .arrow { transform: translateX(3px); }

    .back-issues-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .back-issues-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .issues-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .issue-card {
      border: 1px solid var(--border-strong);
      background: #fbf7ef;
      box-shadow: 3px 3px 0 rgba(26,26,24,0.06);
      transition: box-shadow 0.25s ease, transform 0.25s ease;
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .issue-card:hover {
      transform: translate(-1px,-1px);
      box-shadow: 5px 5px 0 rgba(26,26,24,0.1);
    }

    .issue-card:nth-child(1) { animation-delay: 0.2s; }
    .issue-card:nth-child(2) { animation-delay: 0.3s; }
    .issue-card:nth-child(3) { animation-delay: 0.4s; }
    .issue-card:nth-child(4) { animation-delay: 0.5s; }
    .issue-card:nth-child(5) { animation-delay: 0.6s; }
    .issue-card:nth-child(6) { animation-delay: 0.7s; }

    .card-thumbnail { width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #ffffff; position: relative; border: 1px solid rgba(26,26,24,0.14); box-shadow: 0 3px 8px rgba(26,26,24,0.08), 0 1px 2px rgba(26,26,24,0.05); z-index: 2; }
    .issue-card:hover .card-thumbnail { box-shadow: 0 5px 14px rgba(26,26,24,0.13), 0 2px 4px rgba(26,26,24,0.07); }
    .card-thumbnail img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform 0.4s ease; filter: grayscale(15%); }
    .issue-card:hover .card-thumbnail img { transform: scale(1.04); filter: grayscale(0%); }
    .card-thumbnail .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(45deg, rgba(26,26,24,0.04) 0, rgba(26,26,24,0.04) 1px, transparent 1px, transparent 10px); }

    .placeholder-text { font-family: 'DM Sans', sans-serif; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; }

    .card-info { padding: 1rem 1.1rem 1.2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; }

    .card-issue-number { font-family: 'Unna', serif; font-size: 1.6rem; font-weight: 700; line-height: 1; color: var(--ink); }
    .card-meta { text-align: right; }
    .card-date { font-family: 'DM Sans', sans-serif; font-size: 0.58rem; color: var(--muted); letter-spacing: 0.08em; display: block; margin-bottom: 0.3rem; }
    .card-read { font-family: 'DM Sans', sans-serif; font-size: 0.58rem; font-weight: 500; color: var(--accent-strong); letter-spacing: 0.12em; text-transform: uppercase; }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 2rem 4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-name { font-family: 'Unna', serif; font-style: italic; font-size: 0.9rem; color: var(--muted-strong); }
    .footer-meta { font-family: 'DM Sans', sans-serif; font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

    @media (max-width: 900px) {
      .masthead-top, .archive-label, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      .masthead-rule { margin: 0 1.5rem; }
      .hero { grid-template-columns: 1fr; }
      .hero-info { border-left: none; border-top: 1px solid var(--border-strong); padding: 2rem 1.5rem; }
      .hero-issue-number { font-size: 3rem; }
    }

    @media (max-width: 600px) {
      .masthead-title h1 { font-size: 2.2rem; }
      .issues-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
      footer { flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="masthead-top">
      <span class="masthead-meta">Weekly sustainability intelligence</span>
      <span class="masthead-meta" id="current-date"></span>
    </div>
    <div class="masthead-rule"></div>
    <div class="masthead-title">
      <h1>The Monday ECO-nomics</h1>
      <p class="masthead-tagline">Issue Archive &nbsp;&middot;&nbsp; ESG, Climate, Nature, Sustainable Finance, Circular Economy, Regenerative Economy, Social Impact, AI &amp; Sustainability</p>
    </div>
    <div class="masthead-rule-bottom"></div>
  </header>

  <div class="archive-label">
    <span>Latest issue</span>
  </div>

  <main id="main-content">
    <div id="hero-container"></div>
    <div class="back-issues-label" id="back-issues-label" style="display:none;">
      <span>Back issues</span>
    </div>
    <div class="issues-grid" id="issues-grid"></div>
  </main>

  <footer>
    <span class="footer-name">The Monday ECO-nomics &middot; Juliana Webel</span>
    <span class="footer-meta" id="issue-count"></span>
  </footer>

  <script>
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });

    function buildThumbnail(src, alt) {
      if (src) {
        return `<img src="${src}" alt="${alt}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'><span class=\\'placeholder-text\\'>Issue ${alt}</span></div>'" />`;
      }
      return `<div class="placeholder"><span class="placeholder-text">${alt}</span></div>`;
    }

    fetch('issues.json?v=' + Date.now())
      .then(r => r.json())
      .then(issues => {
        issues.sort((a, b) => new Date(b.date) - new Date(a.date));
        const latest = issues.find(i => i.latest);
        const backIssues = issues.filter(i => !i.latest);

        if (latest) {
          document.getElementById('hero-container').innerHTML = `
            <div class="hero">
              <div class="hero-thumbnail">
                ${buildThumbnail(latest.thumbnail, `Issue ${latest.number}`)}
              </div>
              <div class="hero-info">
                <div>
                  <div class="latest-badge">Latest issue</div>
                  <div class="hero-issue-number">${String(parseInt(latest.number)).padStart(2,'0')}</div>
                  <div class="hero-issue-label">Issue</div>
                  <div class="hero-pub-name">The Monday ECO-nomics</div>
                  <div class="hero-date">${latest.dateDisplay}</div>
                </div>
                <div>
                  <div class="hero-divider"></div>
                  <a class="hero-read-link" href="${latest.filename}">
                    Read this issue <span class="arrow">&rarr;</span>
                  </a>
                </div>
              </div>
            </div>
          `;
        }

        if (backIssues.length > 0) {
          document.getElementById('back-issues-label').style.display = 'flex';
          document.getElementById('issues-grid').innerHTML = backIssues.map(issue => `
            <a class="issue-card" href="${issue.filename}">
              <div class="card-thumbnail">
                ${buildThumbnail(issue.thumbnail, `Issue ${issue.number}`)}
              </div>
              <div class="card-info">
                <div class="card-issue-number">${String(parseInt(issue.number)).padStart(2,'0')}</div>
                <div class="card-meta">
                  <span class="card-date">${issue.dateDisplay}</span>
                  <span class="card-read">Read &rarr;</span>
                </div>
              </div>
            </a>
          `).join('');
        }

        document.getElementById('issue-count').textContent = `${issues.length} edition${issues.length !== 1 ? 's' : ''} published`;
      })
      .catch(err => {
        console.error('Could not load issues.json:', err);
        document.getElementById('hero-container').innerHTML =
          '<p style="color:var(--muted);font-family:monospace;padding:2rem;">Could not load issues. Make sure issues.json is in the same folder.</p>';
      });
  </script>
</body>
</html>
